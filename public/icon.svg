<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bgGrad)" filter="url(#iconShadow)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Subtle Cartography / Globe Graticule Lines -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
  <ellipse cx="32" cy="32" rx="9.5" ry="18" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
  <line x1="14" y1="32" x2="50" y2="32" stroke="rgba(255,255,255,0.18)" stroke-width="1" />

  <!-- Compass Star / Needle (Rotated 25deg for dynamic navigation aesthetic) -->
  <g transform="rotate(25 32 32)">
    <!-- North Arrow -->
    <polygon points="32,15 36.5,32 32,30" fill="url(#needleNorth)" />
    <polygon points="32,15 27.5,32 32,30" fill="#f8fafc" />

    <!-- South Arrow -->
    <polygon points="32,49 36.5,32 32,34" fill="url(#needleSouth)" />
    <polygon points="32,49 27.5,32 32,34" fill="#3b82f6" />

    <!-- Compass Center Pivot -->
    <circle cx="32" cy="32" r="3.2" fill="#ffffff" filter="url(#iconShadow)" />
    <circle cx="32" cy="32" r="1.4" fill="#1e40af" />
  </g>
</svg>
